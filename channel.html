<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seu canal — YouTube2</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header class="topbar"><a class="logo" href="/">YouTube<span>2</span></a><div class="top-actions"><a class="upload-btn" href="/upload.html">＋ Criar</a><a class="login-btn" href="/creator.html">Studio</a></div></header>
<main class="channel-page"><div class="channel-cover"></div><section class="channel-info"><div class="channel-avatar" id="avatar">U</div><div><h1 id="name">Carregando...</h1><p id="handle" class="muted"></p><p id="bio"></p><a class="primary" href="/creator.html">Gerenciar canal</a></div></section><nav class="channel-tabs"><a class="active">Vídeos</a><a href="/shorts.html">Shorts</a><a href="/playlists.html">Playlists</a></nav><section class="dashboard"><div class="section-head"><h2>Vídeos publicados</h2></div><div id="videos" class="grid"></div></section></main>
<script type="module">import{supabase}from'./assets/supabase.js';async function boot(){const{data:{user}}=await supabase.auth.getUser();if(!user){name.textContent='Seu canal';videos.innerHTML='<div class="empty">Entre para ver e gerenciar seus vídeos.</div>';return}const{data:p}=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();name.textContent=p?.display_name||'Seu canal';handle.textContent=p?.username?'@'+p.username:'';bio.textContent=p?.bio||'Canal YouTube2';avatar.textContent=(p?.display_name||'U')[0].toUpperCase();const{data:vs}=await supabase.from('videos').select('*').eq('user_id',user.id).order('created_at',{ascending:false});videos.innerHTML=(vs||[]).map(v=>`<article class="card" onclick="location='/watch.html?id=${v.id}'"><div class="thumb">${v.thumbnail_url?`<img src="${v.thumbnail_url}">`:''}</div><div class="card-body"><div><h3>${v.title}</h3><p>${Number(v.views||0).toLocaleString('pt-BR')} visualizações</p></div></div></article>`).join('')||'<div class="empty">Você ainda não publicou vídeos.</div>'}boot()</script></body></html>
