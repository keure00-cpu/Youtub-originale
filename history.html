<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico — YouTube2</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header class="topbar"><button class="icon-btn" onclick="history.back()">‹</button><a class="logo" href="/">YouTube<span>2</span></a><form class="search" onsubmit="return false"><input placeholder="Pesquisar"><button>⌕</button></form><div class="top-actions"><a class="upload-btn" href="/upload.html">＋ Criar</a><a class="login-btn" href="/login.html">Entrar</a></div></header><main class="dashboard"><div class="section-head"><h2>Histórico</h2><button class="secondary" onclick="localStorage.removeItem('yt2_history');location.reload()">Limpar histórico</button></div><div id="history" class="grid"></div></main><script>const h=JSON.parse(localStorage.getItem("yt2_history")||"[]");document.getElementById("history").innerHTML=h.length?h.map(v=>`<article class="card"><div class="thumb"><img src="${v.thumb||""}"></div><h3>${v.title}</h3><p>${v.channel}</p></article>`).join(""):'<div class="empty">Seu histórico está vazio.</div>'</script></body></html>
