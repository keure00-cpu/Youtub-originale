<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlists — YouTube2</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header class="topbar"><button class="icon-btn" onclick="history.back()">‹</button><a class="logo" href="/">YouTube<span>2</span></a><form class="search" onsubmit="return false"><input placeholder="Pesquisar"><button>⌕</button></form><div class="top-actions"><a class="upload-btn" href="/upload.html">＋ Criar</a><a class="login-btn" href="/login.html">Entrar</a></div></header><main class="dashboard"><div class="section-head"><h2>Playlists</h2><button class="primary" onclick="newPlaylist()">＋ Nova playlist</button></div><div id="playlists" class="grid"></div></main><script>function draw(){let p=JSON.parse(localStorage.getItem("yt2_playlists")||"[]");document.getElementById("playlists").innerHTML=p.length?p.map(x=>`<div class="playlist"><div class="playlist-cover">▶</div><div class="playlist-info"><b>${x.name}</b><p class="muted">${x.count||0} vídeos</p></div></div>`).join(""):'<div class="empty">Crie sua primeira playlist.</div>'}function newPlaylist(){let n=prompt("Nome da playlist:");if(!n)return;let p=JSON.parse(localStorage.getItem("yt2_playlists")||"[]");p.push({name:n,count:0});localStorage.setItem("yt2_playlists",JSON.stringify(p));draw()}draw()</script></body></html>
