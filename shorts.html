<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts — YouTube2</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header class="topbar"><button class="icon-btn" onclick="history.back()">‹</button><a class="logo" href="/">YouTube<span>2</span></a><form class="search" onsubmit="return false"><input placeholder="Pesquisar"><button>⌕</button></form><div class="top-actions"><a class="upload-btn" href="/upload.html">＋ Criar</a><a class="login-btn" href="/login.html">Entrar</a></div></header><main class="content"><div class="section-head"><h2>Shorts</h2></div><div id="shortsGrid" class="grid"></div></main><script src="/assets/app.js"></script><script>const g=document.getElementById("shortsGrid");g.innerHTML=videos.map(v=>`<article class="card" onclick="location.href='/watch.html?id=${v.id}'"><div class="thumb"><img src="${v.thumb||""}"><div class="play">▶</div></div><h3>${v.title}</h3><p>${v.channel}</p></article>`).join("")</script></body></html>
